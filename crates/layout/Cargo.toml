[package]
name = "satori-layout"
version = "0.0.0"
edition = "2024"
publish = false
description = "Taffy layout for Satori, compiled to WebAssembly."
license = "MPL-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Taffy with the patches in `patches/taffy`, see `scripts/build-layout-wasm.mjs`.
taffy = { path = "../../vendor/taffy", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "float_layout", "calc"] }
# Parses the stylesheets of `<style>` elements, see `src/css.rs`.
cssparser = { version = "0.38", default-features = false }
# Decodes WOFF2 fonts, see `decode_woff2`. WOFF fonts are decoded in JavaScript,
# so it doesn't need `z`. `brotli-unsafe` uses the faster, unchecked brotli
# decoder.
wuff = { version = "0.2.10", default-features = false, features = ["brotli-unsafe"] }
# Shapes text, see `src/shape.rs`.
harfrust = { version = "0.16.1", default-features = false, features = ["std"] }
# Generates the JavaScript bindings. Pinned, because the `wasm-bindgen` CLI
# installed by `scripts/install-wasm-bindgen.mjs` must have the same schema
# version. Update its `VERSION` together with this.
wasm-bindgen = { version = "=0.2.130", default-features = false, features = ["std"] }
