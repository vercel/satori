name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  integrity:
    # prevents this action from running on forks
    if: github.repository_owner == 'vercel'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 24 ]
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Enable pnpm
      run: corepack enable pnpm
    - name: Use Node.js ${{ matrix.node }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        cache: 'pnpm'
    - name: Check pnpm
      run: pnpm --version
    - run: pnpm install --frozen-lockfile
    - run: pnpm ci-check

  test:
    # prevents this action from running on forks
    if: github.repository_owner == 'vercel'
    name: Node.js ${{ matrix.node }} on ${{ matrix.os }}
    # Installing compiles the headless-gl dev dependency used by the canvas tests.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The headless-gl dev dependency requires Node.js 20+.
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Check pnpm
        run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Maybe Release
        # Node.js 24 bundles npm 11.19+, which already satisfies the >= 11.5.1
        # that OIDC trusted publishing requires.
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24 && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dlx semantic-release@25.0.5
